# =============================================================================
# Ledgera — Docker Compose stack
#
# Services:
#   stellar-quickstart  — local Stellar network (Horizon + Soroban RPC)
#   agent               — Ledgera backend (connects to quickstart)
#   test-runner         — full-stack integration tests (profile: test)
#   test-runner-only    — tests against quickstart only, no agent (profile: test-only)
#
# Usage:
#   docker compose up --build          # start everything
#   docker compose up stellar-quickstart  # local network only
#   docker compose run --rm agent npm run test:ts  # run TS tests in container
#   docker compose --profile test up --build         # full stack + tests (needs agent healthy)
#   docker compose --profile test-only up --build --abort-on-container-exit --exit-code-from test-runner-only
#     # tests only against stellar-quickstart, skips booting the agent HTTP server
# =============================================================================

version: "3.9"

services:

  # ── Local Stellar network ────────────────────────────────────────────────────
  stellar-quickstart:
    image: stellar/quickstart:latest
    container_name: ledgera-stellar
    platform: linux/amd64        # quickstart only ships amd64
    ports:
      - "8000:8000"              # Horizon REST API
      - "8001:8001"              # Soroban RPC
    environment:
      NETWORK: local             # isolated local network, no real funds
    command: >
      --local
      --enable-soroban-rpc
      --soroban-rpc-port 8001
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ledgera-net

  # ── Ledgera agent ───────────────────────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ledgera-agent
    depends_on:
      stellar-quickstart:
        condition: service_healthy
    environment:
      # Point to the local quickstart network
      STELLAR_NETWORK:    local
      HORIZON_URL:        http://stellar-quickstart:8000
      SOROBAN_RPC_URL:    http://stellar-quickstart:8001
      # Override these via a .env file or CI secrets — never hardcode real keys
      AGENT_SECRET_KEY:   ${AGENT_SECRET_KEY:?AGENT_SECRET_KEY is required}
      X402_ASSET_CODE:    ${X402_ASSET_CODE:-USDC}
      X402_ASSET_ISSUER:  ${X402_ASSET_ISSUER:?X402_ASSET_ISSUER is required}
      AGENT_SPENDING_LIMIT: ${AGENT_SPENDING_LIMIT:-100}
      MAX_RETRIES:        ${MAX_RETRIES:-3}
      RETRY_DELAY_MS:     ${RETRY_DELAY_MS:-1500}
      NODE_ENV:           production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    networks:
      - ledgera-net
    # Mount WASM contract at runtime (optional: already baked into image)
    # volumes:
    #   - ./contracts/escrow:/app/contracts/escrow:ro

  # ── Integration test runner (one-shot, not started by default) ───────────────
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: node-builder      # has devDeps + source
    container_name: ledgera-test-runner
    profiles:
      - test                    # only starts with: docker compose --profile test up
    depends_on:
      stellar-quickstart:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      STELLAR_NETWORK:    local
      HORIZON_URL:        http://stellar-quickstart:8000
      SOROBAN_RPC_URL:    http://stellar-quickstart:8001
      AGENT_SECRET_KEY:   ${AGENT_SECRET_KEY:-process.env.AGENT_SECRET_KEY}
      X402_ASSET_CODE:    USDC
      X402_ASSET_ISSUER:  ${X402_ASSET_ISSUER:-GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN}
      AGENT_SPENDING_LIMIT: "100"
      MAX_RETRIES:        "3"
      RETRY_DELAY_MS:     "100"
    command: npm run test:ts
    restart: "no"
    networks:
      - ledgera-net

  # ── Test-only runner (no agent HTTP server) ─────────────────────────────────
  # Starts just stellar-quickstart + this container — skips building/booting the
  # full agent service for faster local runs and CI.
  test-runner-only:
    build:
      context: .
      dockerfile: Dockerfile
      target: node-builder      # has devDeps + source
    container_name: ledgera-test-runner-only
    profiles:
      - test-only              # only starts with: docker compose --profile test-only up
    depends_on:
      stellar-quickstart:
        condition: service_healthy
    environment:
      STELLAR_NETWORK:    local
      HORIZON_URL:        http://stellar-quickstart:8000
      SOROBAN_RPC_URL:    http://stellar-quickstart:8001
      AGENT_SECRET_KEY:   ${AGENT_SECRET_KEY:-process.env.AGENT_SECRET_KEY}
      X402_ASSET_CODE:    USDC
      X402_ASSET_ISSUER:  ${X402_ASSET_ISSUER:-GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN}
      AGENT_SPENDING_LIMIT: "100"
      MAX_RETRIES:        "3"
      RETRY_DELAY_MS:     "100"
    command: npm run test:ts
    restart: "no"
    networks:
      - ledgera-net

networks:
  ledgera-net:
    driver: bridge
